<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Практика — Три корзины</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#26323b;background:#f7f9f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #346fa4;outline-offset:2px}.app{max-width:880px;min-height:540px;height:min(700px,100dvh);height:min(700px,100vh);margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #e1e6e7;border-radius:15px;box-shadow:0 12px 35px #21313a12}.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e5ebed;background:#fff;gap:10px}.brand{font-weight:700;font-size:15px}.step{font-size:12px;color:#71808b}.tools{display:flex;gap:8px}.tool{display:grid;place-items:center;width:32px;height:32px;background:#eef3f6;border:0;border-radius:9px;color:#374a57;font-size:20px}.main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:15px 18px 10px}.intro{font-size:14px;line-height:1.52;margin:0 0 12px}.intro strong{color:#263c4b}.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.zone{border:2px dashed #b3c6d3;border-radius:12px;padding:9px 8px;min-width:0;min-height:105px;background:#f4f8fa;display:flex;flex-direction:column;gap:7px;transition:background .12s,border-color .12s}.zone[data-zone="fact"]{background:#edf8ed;border-color:#9dcaa4}.zone[data-zone="interpret"]{background:#fff6e7;border-color:#e8c58c}.zone[data-zone="assume"]{background:#edf4ff;border-color:#a4c2ee}.zone.over,.pool.over{outline:3px solid #6a9acc;outline-offset:-3px}.zonehead{font-size:13px;font-weight:700;line-height:1.2;text-align:center}.zonesub{font-size:10px;line-height:1.3;color:#677781;text-align:center;margin-top:-2px}.zonecards{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px}.poolWrap{border:1px solid #dce4e9;border-radius:12px;background:#fbfcfe;padding:10px}.poolhead{font-size:13px;font-weight:700;margin:0 0 7px}.pool{min-height:83px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-content:start;padding:3px;border-radius:8px}.chip{position:relative;min-width:0;border-radius:9px;padding:9px 8px;border:1px solid #c7d4df;background:#fff;box-shadow:0 2px 4px #0000000e;font-size:12px;line-height:1.38;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow-wrap:anywhere;transition:border-color .15s,background .15s}.chip:active{cursor:grabbing}.chip.placing{opacity:.43}.chip.good{border:2px solid #2e9f54;background:#effaf1}.chip.bad{border:2px solid #db5353;background:#fff0f0}.chip .back{position:absolute;top:3px;right:3px;display:none;border:0;border-radius:6px;background:#e9eff3;color:#354b5b;font-size:12px;padding:2px 5px;line-height:1}.zone .chip{width:100%;padding-right:24px}.zone .chip .back{display:block}.zone .chip:only-child{margin-top:1px}.zone .chip .back:hover{background:#cfdee8}.footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid #e5ebed;background:#fff}.hint{font-size:12px;color:#697983;flex:1;min-width:110px}.btn{border:0;border-radius:10px;background:#2683ce;color:white;padding:10px 15px;font-size:13px;font-weight:700;min-height:39px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.light{background:#edf2f6;color:#314c5f}.status{font-size:12px;font-weight:600;margin:8px 0 0;min-height:16px}.status.red{color:#b53e3e}.status.green{color:#27844a}.question{max-width:680px;margin:16px auto}.question h2{font-size:21px;margin:0 0 16px}.question .scenario{background:#f3f7fa;padding:16px;border-radius:12px;line-height:1.55;font-size:15px}.question .ask{font-size:16px;font-weight:700;margin:19px 0 12px}.option{display:flex;gap:10px;align-items:flex-start;width:100%;border:1px solid #cfdae1;border-radius:11px;background:#fff;padding:14px;text-align:left;font-size:14px;line-height:1.45;margin:8px 0}.option input{margin:3px 0 0;accent-color:#287bb5}.option.active{border:2px solid #5c9acb;padding:13px}.option.bad{border:2px solid #d55353;background:#fff0f0;padding:13px}.option.good{border:2px solid #309c58;background:#eefaf1;padding:13px}.feedback{border-radius:10px;padding:12px;background:#f3f7fa;font-size:14px;line-height:1.5;margin-top:14px}.finished{max-width:610px;margin:65px auto 0;text-align:center}.finished h2{font-size:25px}.finished p{font-size:15px;line-height:1.6}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#1a29347a;z-index:30;padding:18px}.modal[hidden]{display:none}.dialog{width:min(480px,100%);max-height:85%;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 16px 60px #0004;overflow:hidden}.dialog h2{margin:0;padding:20px 20px 4px;font-size:23px;text-align:center}.dialog .body{overflow:auto;font-size:15px;line-height:1.56;padding:8px 22px 15px}.dialog .bottom{text-align:center;padding:0 20px 20px}.dialog .bottom button{min-width:115px}.dragGhost{position:fixed;z-index:100;pointer-events:none;opacity:.95;transform:rotate(-1deg);box-shadow:0 10px 28px #172e3f32;max-width:270px}.app:fullscreen{max-width:none;width:100vw;height:100dvh;border-radius:0;box-shadow:none}.app:fullscreen .main{padding:clamp(14px,3vh,30px) clamp(15px,4vw,60px)}.app:fullscreen .chip{font-size:clamp(13px,1.35vw,18px);padding:clamp(8px,1.4vh,17px)}.app:fullscreen .intro{font-size:clamp(15px,1.5vw,20px)}.app:fullscreen .zonehead{font-size:clamp(14px,1.6vw,20px)}.app:fullscreen .zones{gap:15px}.app:fullscreen .pool{gap:12px}.app:fullscreen .zonesub{font-size:13px}@media(max-width:590px){.app{border-radius:0;min-height:0;height:100dvh}.main{padding:12px}.zones{gap:5px}.zone{padding:7px 5px;min-height:110px}.zonehead{font-size:11px}.zonesub{font-size:9px}.pool{grid-template-columns:repeat(2,minmax(0,1fr))}.chip{font-size:11px;padding:8px 6px}.zone .chip{padding-right:20px}.intro{font-size:13px}.footer{padding:9px 12px}.question{margin:4px auto}.question h2{font-size:19px}.question .scenario,.option{font-size:13px}.question .ask{font-size:14px}}@media(min-width:591px) and (max-height:620px){.main{padding-top:10px}.intro{font-size:13px}.chip{font-size:11px;padding:7px}.zone{min-height:80px}.pool{min-height:65px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="app" id="app">
<header class="top"><div><div class="brand">Практика · Три корзины</div><div class="step" id="stepLabel">Этап 1 из 2</div></div><div class="tools"><button class="tool" id="helpBtn" aria-label="Инструкция" title="Инструкция">?</button><button class="tool" id="fullBtn" aria-label="На весь экран" title="На весь экран">⛶</button></div></header>
<main class="main" id="main"></main><footer class="footer"><div class="hint" id="hint"></div><button class="btn light" id="tryBtn" hidden>Попробовать снова</button><button class="btn light" id="resetBtn" hidden>Начать заново</button><button class="btn" id="checkBtn">Проверить</button></footer>
<div class="modal" id="modal"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Задание</h2><div class="body" id="modalBody"></div><div class="bottom"><button class="btn light" id="modalOk">OK</button></div></div></div></div>
<script>
'use strict';
const CARDS=[
{id:'f1',zone:'fact',text:'За первый месяц работы сервиса служба поддержки получила 340 обращений. За предыдущий месяц — 210.'},
{id:'f2',zone:'fact',text:'Средняя оценка обслуживания изменилась с 4,7 до 4,6 балла.'},
{id:'f3',zone:'fact',text:'В 86 обращениях клиенты спрашивали, как воспользоваться новой функцией сервиса.'},
{id:'i1',zone:'interpret',text:'Клиентам стало сложнее пользоваться сервисом после обновления.'},
{id:'i2',zone:'interpret',text:'Рост обращений означает, что сотрудники недостаточно понятно объясняют возможности сервиса.'},
{id:'i3',zone:'interpret',text:'Клиенты ставят почти прежние оценки, потому что специалисты поддержки хорошо справляются с возросшей нагрузкой.'},
{id:'a1',zone:'assume',text:'В следующем месяце количество обращений продолжит расти.'},
{id:'a2',zone:'assume',text:'Если ничего не изменить, клиенты начнут отказываться от сервиса.'},
{id:'a3',zone:'assume',text:'После публикации новых инструкций количество обращений сократится вдвое.'}
];
const choices=[
'Данных о том, какие трудности испытывают клиенты при использовании сервиса.',
'Прогноза количества обращений в следующем месяце.',
'Сравнения оценок работы специалистов поддержки за два месяца.'
];
const state={step:1,place:{},order:[],checked:false,selected:null,qChecked:false,qCorrect:false,drag:null};
const $=id=>document.getElementById(id);const main=$('main');
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function initial(){state.step=1;state.place=Object.fromEntries(CARDS.map(c=>[c.id,'pool']));state.order=shuffle(CARDS.map(c=>c.id));state.checked=false;state.selected=null;state.qChecked=false;state.qCorrect=false;render()}
function modal(html,title='Задание'){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').hidden=false;$('modalOk').focus()}
const instr1='Месяц назад компания запустила новый сервис для клиентов. После запуска количество обращений в службу поддержки выросло, хотя оценки качества обслуживания почти не изменились.<p>На совещании коллеги обсуждают первые результаты. Одни приводят данные из отчётов, другие объясняют причины роста обращений, третьи прогнозируют дальнейшее развитие ситуации.</p><p><b>Распределите девять утверждений по трём корзинам: «Факты», «Интерпретации» и «Предположения».</b> Перетаскивайте карточки мышью или пальцем. Для возврата карточки в общий список нажмите ↩ на ней. Правильность ответов станет известна только после нажатия «Проверить».</p>';
const instr2='Вы распределили утверждения по трём корзинам. Теперь определите, какую информацию необходимо проверить перед управленческим решением. Выберите один ответ и нажмите «Проверить». Если ответ окажется неверным, попробуйте ещё раз: правильный вариант заранее не показывается.';
function el(tag,cls,content){let node=document.createElement(tag);if(cls)node.className=cls;if(content!==undefined)node.textContent=content;return node}
function makeChip(id){const c=CARDS.find(x=>x.id===id),chip=el('div','chip',c.text);chip.dataset.id=id;chip.setAttribute('role','button');chip.setAttribute('tabindex','0');chip.setAttribute('aria-label',c.text+'; перетащить');if(state.checked)chip.classList.add(state.place[id]===c.zone?'good':'bad');chip.addEventListener('pointerdown',startDrag);chip.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openMoveMenu(id)}});if(state.place[id]!=='pool'){const b=el('button','back','↩');b.type='button';b.setAttribute('aria-label','Вернуть карточку в общий список');b.addEventListener('pointerdown',ev=>ev.stopPropagation());b.addEventListener('click',ev=>{ev.stopPropagation();move(id,'pool')});chip.append(b)}return chip}
function openMoveMenu(id){const opts=[['pool','Общий список'],['fact','Факты'],['interpret','Интерпретации'],['assume','Предположения']];let html='<p>Куда переместить карточку?</p>'+opts.map(([k,n])=>`<button class="btn light" style="display:block;width:100%;margin:7px 0" data-to="${k}">${n}</button>`).join('');modal(html,'Переместить карточку');$('modalBody').querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',()=>{move(id,b.dataset.to);$('modal').hidden=true}))}
function move(id,to){if(!['pool','fact','interpret','assume'].includes(to))return;if(state.place[id]===to)return;state.place[id]=to;state.checked=false;render()}
function render(){main.replaceChildren();$('stepLabel').textContent='Этап '+Math.min(state.step,2)+' из 2';$('checkBtn').hidden=state.step===3;$('tryBtn').hidden=true;$('resetBtn').hidden=state.step!==3;$('hint').textContent='';if(state.step===1)renderSort();if(state.step===2)renderQuestion();if(state.step===3)renderFinish()}
function renderSort(){let p=el('p','intro');p.innerHTML='<strong>Ситуация.</strong> Месяц назад компания запустила новый сервис для клиентов. После запуска количество обращений в службу поддержки выросло, хотя оценки качества обслуживания почти не изменились. Коллеги обсуждают результаты: разделите их утверждения на факты, интерпретации и предположения.';main.append(p);const zones=el('div','zones');for(const [key,title,sub] of [['fact','Факты','Что можно проверить'],['interpret','Интерпретации','Как объясняют ситуацию'],['assume','Предположения','Что пока неизвестно']]){let z=el('section','zone');z.dataset.zone=key;z.append(el('div','zonehead',title),el('div','zonesub',sub));let content=el('div','zonecards');state.order.filter(id=>state.place[id]===key).forEach(id=>content.append(makeChip(id)));z.append(content);addTarget(z);zones.append(z)}main.append(zones);let wrap=el('section','poolWrap');wrap.append(el('h3','poolhead','Карточки для распределения'));let pool=el('div','pool');pool.dataset.zone='pool';state.order.filter(id=>state.place[id]==='pool').forEach(id=>pool.append(makeChip(id)));wrap.append(pool);addTarget(pool);main.append(wrap);let status=el('div','status');const count=CARDS.filter(c=>state.place[c.id]!=='pool').length;$('hint').textContent=`Распределено ${count} из 9`;if(state.checked){let wrong=CARDS.filter(c=>state.place[c.id]!==c.zone).length;status.classList.add(wrong?'red':'green');status.textContent=wrong?`Неверно размещены карточки: ${wrong}. Красные карточки можно перенести в другую корзину или вернуть в общий список. Правильные места не раскрываются.`:'Все девять утверждений распределены верно!';if(!wrong){const n=el('button','btn','Перейти к вопросу →');n.addEventListener('click',()=>{state.step=2;render();modal(instr2)});main.append(n);$('checkBtn').hidden=true}}main.append(status);$('checkBtn').disabled=count!==9}
function addTarget(node){node.addEventListener('dragover',e=>e.preventDefault())}
function renderQuestion(){let box=el('section','question');box.append(el('h2','','Что нужно проверить перед решением?'));let scen=el('div','scenario','Руководитель предлагает срочно переделать интерфейс сервиса, потому что считает его неудобным для клиентов.');box.append(scen,el('p','ask','Какой информации пока не хватает для такого решения?'));choices.forEach((label,i)=>{let b=el('label','option');if(state.selected===i)b.classList.add('active');if(state.qChecked&&state.selected===i)b.classList.add(state.qCorrect?'good':'bad');let input=document.createElement('input');input.type='radio';input.name='answer';input.checked=state.selected===i;input.addEventListener('change',()=>{state.selected=i;state.qChecked=false;render()});b.append(input,el('span','',label));box.append(b)});if(state.qChecked){let feedback=el('div','feedback');if(state.qCorrect){feedback.textContent='Верно! Рост числа обращений ещё не доказывает, что причина в интерфейсе. Сначала нужно выяснить, с какими трудностями сталкиваются клиенты и какие действия вызывают вопросы. После этого можно решить, что именно требуется изменить.'}else{feedback.textContent='Пока неверно. Выбранный ответ не показывает, с какими трудностями сталкиваются клиенты. Попробуйте выбрать другой вариант и снова проверить.'}box.append(feedback)}main.append(box);$('hint').textContent='Выберите один вариант';$('checkBtn').disabled=state.selected===null;$('checkBtn').textContent=state.qChecked&&state.qCorrect?'Завершить':'Проверить'}
function renderFinish(){let f=el('section','finished');f.innerHTML='<div style="font-size:42px">✓</div><h2>Задание выполнено!</h2><p>Вы отделили проверенные данные от объяснений и предположений, а затем определили, какую информацию необходимо выяснить перед решением. Это помогает не принимать управленческие решения на основании неподтверждённых выводов.</p>';main.append(f);$('hint').textContent='Оба этапа пройдены'}
$('checkBtn').addEventListener('click',()=>{if(state.step===1){if(CARDS.some(c=>state.place[c.id]==='pool'))return;state.checked=true;render()}else if(state.step===2){if(state.qCorrect&&state.qChecked){state.step=3;render();return}if(state.selected===null)return;state.qChecked=true;state.qCorrect=state.selected===0;render();if(state.qCorrect)$('checkBtn').textContent='Завершить'}});
$('tryBtn').addEventListener('click',()=>{state.checked=false;state.qChecked=false;render()});$('resetBtn').addEventListener('click',initial);$('helpBtn').addEventListener('click',()=>modal(state.step===1?instr1:instr2));$('modalOk').addEventListener('click',()=>$('modal').hidden=true);$('fullBtn').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else $('app').requestFullscreen?.().catch(()=>{})});document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'⤢':'⛶'});
let drag=null;function startDrag(ev){if(ev.target.closest('button'))return;if(ev.button!==0&&ev.pointerType==='mouse')return;const chip=ev.currentTarget,id=chip.dataset.id;drag={id,startX:ev.clientX,startY:ev.clientY,ghost:null,pointerId:ev.pointerId,source:chip};chip.setPointerCapture(ev.pointerId);chip.addEventListener('pointermove',onDragMove);chip.addEventListener('pointerup',onDragEnd,{once:true});chip.addEventListener('pointercancel',onDragCancel,{once:true})}
function onDragMove(ev){if(!drag)return;let dx=ev.clientX-drag.startX,dy=ev.clientY-drag.startY;if(!drag.ghost&&Math.hypot(dx,dy)<6)return;if(!drag.ghost){let r=drag.source.getBoundingClientRect();let g=drag.source.cloneNode(true);g.classList.add('dragGhost');g.style.width=Math.min(r.width,280)+'px';g.querySelector('.back')?.remove();document.body.append(g);drag.ghost=g;drag.source.classList.add('placing')}drag.ghost.style.left=(ev.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(ev.clientY-25)+'px';document.querySelectorAll('.zone.over,.pool.over').forEach(n=>n.classList.remove('over'));let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-zone]');target?.classList.add('over')}
function clearDrag(){if(!drag)return;drag.source.classList.remove('placing');drag.source.removeEventListener('pointermove',onDragMove);drag.ghost?.remove();document.querySelectorAll('.zone.over,.pool.over').forEach(n=>n.classList.remove('over'));drag=null}
function onDragEnd(ev){if(!drag)return;let id=drag.id,hadGhost=!!drag.ghost;let target=hadGhost?document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-zone]'):null;const to=target?.dataset.zone;clearDrag();if(to)move(id,to)}function onDragCancel(){clearDrag()}
initial();modal(instr1);
</script></body></html>
