<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Практика — Делегирование задач</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#303336;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff}body{overflow:hidden}.app{position:relative;width:100%;height:100dvh;min-height:400px;max-width:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff}.toolbar{height:40px;min-height:40px;display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#fafafa;z-index:11}.tool{border:0;background:transparent;color:#256a9a;font-size:22px;cursor:pointer;width:36px;height:32px;border-radius:7px}.tool:hover{background:#e8f0f6}.board{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}.zone{position:absolute;left:0;width:100%;height:50%;pointer-events:none}.zone.good{top:0;background:radial-gradient(ellipse at 52% 36%,#d8e7af 0%,#c8dfa0 100%)}.zone.bad{top:50%;background:radial-gradient(ellipse at 45% 38%,#ffe6c9 0%,#ffd0a6 100%)}.zone-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;text-align:center;font-size:clamp(18px,3vw,28px);color:#4a4d4b;opacity:.55;pointer-events:none}.divider{position:absolute;top:50%;left:0;right:0;height:2px;background:#fff8}.card{position:absolute;z-index:2;background:white;border:3px solid #e9eceb;border-radius:15px;box-shadow:0 4px 9px #0002;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 7px 6px;line-height:1.18;font-size:clamp(11px,1.85vw,16px);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow-wrap:break-word;transition:border-color .14s,box-shadow .14s}.card:active{cursor:grabbing}.card.dragging{z-index:10;box-shadow:0 9px 20px #0004;transition:none}.card:before{content:"";position:absolute;width:17px;height:17px;top:-9px;left:calc(50% - 8px);background:#44a6d6;border-radius:50%;box-shadow:0 1px 4px #0003}.card.correct{border-color:#78e787}.card.correct:before{background:#00a64d}.card.wrong{border-color:#f27979}.card.wrong:before{background:#f3422c}.footer{height:62px;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:7px 11px;background:#fff}.status{font-size:13px;line-height:1.3;flex:1}.actions{display:flex;gap:7px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;background:#e9eef2;color:#334}.btn.primary{background:#238de0;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.overlay{position:absolute;inset:0;z-index:30;background:#0005;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(100%,470px);max-height:min(90%,550px);display:flex;flex-direction:column;background:#fff;border:11px solid #d5d5d5;border-radius:16px;box-shadow:0 7px 26px #0005;padding:18px 18px 15px}.modal h2{text-align:center;margin:0 0 14px;font-size:24px}.modal p{font-size:17px;line-height:1.47;overflow-y:auto;margin:0 0 18px}.modal button{align-self:center;background:#e7e7e7;border:0;border-radius:50px;padding:9px 34px;font-size:19px;cursor:pointer}.app.fake-full{position:fixed;inset:0;width:100vw;height:100dvh;z-index:9999}.app:fullscreen{width:100vw;height:100dvh}.app:fullscreen .card,.app.fake-full .card{font-size:clamp(13px,1.8vw,22px)}
@media(max-width:540px){.toolbar{height:36px;min-height:36px}.footer{height:70px;min-height:70px;padding:5px 7px;gap:5px}.btn{padding:9px 8px;font-size:11px}.status{font-size:11px}.card{font-size:clamp(11px,2.6vw,15px);border-width:2px;border-radius:12px;padding:6px 3px 3px}.card:before{width:12px;height:12px;top:-7px;left:calc(50% - 6px)}.zone-title{font-size:19px}.modal{padding:16px;border-width:8px}.modal p{font-size:15px}}
@media(max-height:520px){.toolbar{height:32px;min-height:32px}.footer{height:48px;min-height:48px}.card{font-size:clamp(10px,1.6vw,14px);padding:3px}.zone-title{font-size:17px}}
</style></head><body>
<main class="app" id="app">
 <div class="toolbar"><button class="tool" id="help" aria-label="Показать инструкцию" title="Инструкция">❔</button><button class="tool" id="full" aria-label="Развернуть" title="На весь экран">⛶</button></div>
 <section class="board" id="board" aria-label="Поле сортировки">
  <div class="zone good"><div class="zone-title">Можно делегировать</div></div><div class="zone bad"><div class="zone-title">Нельзя делегировать</div></div><div class="divider"></div>
 </section>
 <footer class="footer"><span class="status" id="status" aria-live="polite">Перетащите каждую карточку в подходящую область.</span><div class="actions"><button class="btn hidden" id="retry">Попробовать снова</button><button class="btn hidden" id="reset">Начать заново</button><button class="btn primary" id="check">✓ Проверить</button></div></footer>
 <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle">Задание</h2><p>Перед вами восемь задач. Определите, какие из них можно делегировать, а какие нельзя.<br><br>Перетащите карточки в соответствующие области. Ответы будут проверены только после нажатия кнопки «Проверить».</p><button id="ok">OK</button></div></div>
</main>
<script>
(()=>{'use strict';
const data=[
 {id:0,text:'Переговоры',answer:0},
 {id:1,text:'Задачи, которые можно стандартизировать',answer:0},
 {id:2,text:'Задачи, для выполнения которых не нужны специальные навыки',answer:0},
 {id:3,text:'Решения по расходам в пределах 500 тыс. руб.',answer:0},
 {id:4,text:'Решения по расходам больше 1 млн руб.',answer:1},
 {id:5,text:'Формирование команд',answer:1},
 {id:6,text:'Разработка стратегии',answer:1},
 {id:7,text:'Формирование корпоративной культуры',answer:1}
];
const app=document.getElementById('app'),board=document.getElementById('board'),status=document.getElementById('status'),overlay=document.getElementById('overlay'),check=document.getElementById('check'),retry=document.getElementById('retry'),reset=document.getElementById('reset');
let cards=[],drag=null,checked=false,attempt=0;
const shuffle=(arr)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
// Each zone has four initial positions, randomly populated; answer never determines location.
function dimensions(){let w=board.clientWidth,h=board.clientHeight;return {w,h,cols:w<480?2:4,cardW:w<480?Math.min((w-24)/2,240):Math.min((w-56)/4,240),cardH:Math.min(Math.max((h/2-36)/2,62),125)};}
function setPos(obj,x,y){let {w,h,cardW,cardH}=dimensions();let px=Math.max(3,Math.min(x,w-cardW-3)),py=Math.max(10,Math.min(y,h-cardH-4));obj.x=px;obj.y=py;obj.el.style.left=px+'px';obj.el.style.top=py+'px';}
function layout(){const d=dimensions();for(let obj of cards){obj.el.style.width=d.cardW+'px';obj.el.style.height=d.cardH+'px';if(obj.x!=null)setPos(obj,obj.x/dOld.w*d.w,obj.y/dOld.h*d.h);}dOld={w:d.w,h:d.h};}
let dOld={w:1,h:1};
function init(){cards.forEach(c=>c.el.remove());cards=[];checked=false;attempt=0;const d=dimensions();dOld={w:d.w,h:d.h};const indexes=shuffle(data);let positions=[];for(let z=0;z<2;z++){for(let row=0;row<2;row++){for(let col=0;col<2;col++){let x=(col===0?0.02:0.52)*d.w;let y=z*d.h/2+row*(d.cardH+8)+Math.max(8,(d.h/2-2*d.cardH-12)/2);positions.push({x,y});}}}if(d.cols===4){positions=[];for(let z=0;z<2;z++)for(let col=0;col<4;col++){positions.push({x: 7+col*(d.w-14)/4,y: z*d.h/2+(d.h/2-d.cardH)/2});}}
 indexes.forEach((item,i)=>{const el=document.createElement('div');el.className='card';el.textContent=item.text;el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',item.text+'. Перетащите в выбранную область');el.style.width=d.cardW+'px';el.style.height=d.cardH+'px';board.appendChild(el);let o={...item,el,x:0,y:0};cards.push(o);setPos(o,positions[i].x,positions[i].y);el.addEventListener('pointerdown',e=>startDrag(e,o));el.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();clearMarks();const move=18;setPos(o,o.x+(e.key==='ArrowLeft'?-move:e.key==='ArrowRight'?move:0),o.y+(e.key==='ArrowUp'?-move:e.key==='ArrowDown'?move:0));}});});
 status.textContent='Перетащите каждую карточку в подходящую область.';check.classList.remove('hidden');retry.classList.add('hidden');reset.classList.add('hidden');}
function clearMarks(){if(!checked)return;checked=false;cards.forEach(o=>o.el.classList.remove('correct','wrong'));retry.classList.add('hidden');reset.classList.add('hidden');check.classList.remove('hidden');status.textContent='Ответы изменены. Нажмите «Проверить».';}
function startDrag(e,o){if(e.button!==undefined&&e.button!==0)return;if(!overlay.classList.contains('hidden'))return;clearMarks();e.preventDefault();o.el.setPointerCapture(e.pointerId);drag={o,id:e.pointerId,sx:e.clientX,sy:e.clientY,x:o.x,y:o.y};o.el.classList.add('dragging');}
board.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();setPos(drag.o,drag.x+e.clientX-drag.sx,drag.y+e.clientY-drag.sy);});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;drag.o.el.classList.remove('dragging');drag=null;}
board.addEventListener('pointerup',endDrag);board.addEventListener('pointercancel',endDrag);
check.addEventListener('click',()=>{checked=true;attempt++;let n=0;const d=dimensions();for(const o of cards){let zone=(o.y+d.cardH/2>=d.h/2)?1:0;let ok=zone===o.answer;if(ok)n++;o.el.classList.toggle('correct',ok);o.el.classList.toggle('wrong',!ok);}status.textContent=n===8?'Отлично! Все 8 задач распределены верно.':`Верно: ${n} из 8. Красные карточки можно переместить и проверить ещё раз.`;check.classList.add('hidden');retry.classList.remove('hidden');reset.classList.remove('hidden');});
retry.addEventListener('click',()=>{checked=false;cards.forEach(o=>o.el.classList.remove('correct','wrong'));retry.classList.add('hidden');reset.classList.add('hidden');check.classList.remove('hidden');status.textContent='Переместите карточки и проверьте ещё раз.';});
reset.addEventListener('click',init);
function showHelp(){overlay.classList.remove('hidden');}document.getElementById('help').addEventListener('click',showHelp);document.getElementById('ok').addEventListener('click',()=>overlay.classList.add('hidden'));
document.getElementById('full').addEventListener('click',async()=>{if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){};app.classList.remove('fake-full')}else if(app.classList.contains('fake-full')){app.classList.remove('fake-full')}else{try{if(app.requestFullscreen)await app.requestFullscreen();else app.classList.add('fake-full')}catch(e){app.classList.add('fake-full')}}setTimeout(()=>resize(),60)});
function resize(){const d=dimensions();let prev={...dOld};cards.forEach(o=>{o.el.style.width=d.cardW+'px';o.el.style.height=d.cardH+'px';setPos(o,o.x/prev.w*d.w,o.y/prev.h*d.h)});dOld={w:d.w,h:d.h};}
window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);
init();
})();
</script></body></html>
