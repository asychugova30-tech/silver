<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ресурсы для выполнения задач — найди пару</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#353535;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f7f5e9}body{overflow:hidden}.app{width:100%;height:100dvh;min-height:360px;display:flex;flex-direction:column;overflow:hidden;background:#fff5c7}.app.expanded{position:fixed;inset:0;z-index:99999;height:100dvh}.toolbar{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#ffefab;border-bottom:1px solid #ebd98d;flex-shrink:0}.iconbtn{border:1px solid #c6b77d;background:#fffdf3;color:#235981;border-radius:9px;width:36px;height:34px;cursor:pointer;font-size:19px}.heading{font-weight:700;font-size:clamp(14px,2.2vw,19px);margin-right:auto}.counter{font-size:12px;color:#6a624a;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(180px,.8fr);gap:10px;padding:10px;flex:1;min-height:0}.pane{min-height:0;min-width:0;border-radius:13px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #e4dca5;background:#fffcef}.paneheader{padding:10px 12px;font-weight:700;font-size:15px;background:#faedac;border-bottom:1px solid #ebdd99}.scroll{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;min-height:0;padding:9px;scrollbar-width:thin}.definition{position:relative;background:#fff;border:2px solid #e2decb;border-radius:12px;margin-bottom:9px;min-height:74px;padding:10px;box-shadow:0 2px 5px #0000000a;transition:background .12s,border-color .12s}.definition.over{border-color:#4d95c6;background:#e8f5ff}.definition.good{border-color:#55bd73;background:#edffeb}.definition.bad{border-color:#e77272;background:#fff0f0}.def-top{display:flex;align-items:center;gap:9px}.num{border-radius:50%;background:#d8edf7;color:#27698a;display:inline-grid;place-items:center;min-width:24px;height:24px;font-size:12px;font-weight:700}.deftext{font-size:clamp(12px,1.6vw,15px);line-height:1.42;white-space:normal}.deftext.collapsed{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.readmore{border:0;background:transparent;color:#1675a8;cursor:pointer;font-size:13px;padding:5px 0 0;text-decoration:underline}.slot{margin-top:8px;min-height:36px;border:1.5px dashed #bed4bd;border-radius:8px;display:flex;align-items:center;padding:4px 7px;color:#9b9c8b;font-size:12px;background:#f6faf2}.slot.filled{border:none;background:transparent;padding:0}.labelcard{background:#fff;border:2px solid #8edc92;border-radius:10px;padding:9px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;font-size:clamp(12px,1.5vw,15px);line-height:1.3;font-weight:600;box-shadow:0 2px 6px #00000013;position:relative}.labelcard:active{cursor:grabbing}.labelcard.selected{outline:3px solid #438fc6}.labelcard.good{border-color:#28a450;background:#e3f9e6}.labelcard.bad{border-color:#d95151;background:#ffe8e8}.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}.slot .labelcard{width:100%;padding:7px 8px;text-align:left}.empty{padding:14px 9px;font-size:13px;color:#777;grid-column:1/-1;text-align:center}.labelsPane .scroll{display:flex;flex-direction:column;gap:9px}.returnZone{border:2px dashed #b5c9a9;border-radius:11px;min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:#f5f9e9;color:#5b7653;font-size:12px;flex-shrink:0}.returnZone.over{border-color:#288bd0;background:#e1f3ff}.labels{flex:1;align-content:start}.slot .labelcard{padding-right:34px}.returnBtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);height:28px;width:28px;border:1px solid #c8d7c6;background:#f5faf3;border-radius:7px;color:#32734d;font-size:19px;cursor:pointer;touch-action:manipulation}.returnBtn:hover{background:#def3df}.footer{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:9px 12px;flex-shrink:0;border-top:1px solid #eddfaa;background:#fff4c5}.primary{border:none;background:#288bd0;color:#fff;font-size:14px;font-weight:700;padding:10px 15px;border-radius:9px;cursor:pointer}.secondary{border:1px solid #c7b88b;background:#fff;color:#444;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer}.notice{font-size:12px;color:#615b42;flex:1;min-width:145px}.dragghost{position:fixed;pointer-events:none;z-index:100000;border:2px solid #6ebf80;background:white;padding:10px 14px;border-radius:10px;box-shadow:0 7px 18px #0004;font-weight:700;max-width:240px;transform:translate(-50%,-50%)}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:100001;padding:18px}.modal{background:#fff;border:11px solid #c6c6c6;box-shadow:0 6px 20px #0005;border-radius:16px;width:min(470px,100%);max-height:min(85dvh,660px);display:flex;flex-direction:column;padding:18px}.modal h2{text-align:center;margin:0 0 10px;font-size:25px}.modal .contents{overflow:auto;line-height:1.52;font-size:17px;white-space:pre-wrap}.modal .ok{align-self:center;border:0;background:#e9e9e9;border-radius:28px;padding:8px 34px;margin-top:14px;font-size:19px;cursor:pointer}.hidden{display:none!important}@media(max-width:530px){.layout{grid-template-columns:minmax(0,1.32fr) minmax(120px,.85fr);gap:6px;padding:6px}.paneheader{font-size:12px;padding:7px}.scroll{padding:5px}.definition{padding:7px;border-radius:9px}.deftext{font-size:12px}.labels{grid-template-columns:1fr;gap:6px}.labelcard{font-size:12px;padding:7px 5px}.toolbar{padding:6px}.heading{font-size:13px}.footer{padding:6px}.primary,.secondary{font-size:12px;padding:8px}.notice{font-size:11px}}@media(max-height:550px){.toolbar{padding:5px 9px}.footer{padding:5px 9px}.layout{padding:5px}}
</style></head>
<body><main id="app" class="app"><header class="toolbar"><button id="help" class="iconbtn" aria-label="Инструкция">?</button><div class="heading">Ресурсы для выполнения задач</div><span class="counter" id="count">0 из 8</span><button id="fullscreen" class="iconbtn" aria-label="На весь экран">⛶</button></header><section class="layout"><section class="pane"><div class="paneheader">Определения ресурсов</div><div class="scroll" id="defs"></div></section><section class="pane labelsPane"><div class="paneheader">Названия ресурсов</div><div class="scroll" id="namesScroll"><div class="returnZone" id="returnZone">↩ Перетащите сюда карточку, чтобы вернуть её в общий список</div><div class="labels" id="labels"></div></div></section></section><footer class="footer"><button class="primary" id="check">✓ Проверить</button><button class="secondary" id="retry" hidden>Попробовать снова</button><button class="secondary" id="reset">Начать заново</button><span id="notice" class="notice">Перетащите название к подходящему определению. Нажмите «Подробнее», чтобы прочитать весь текст.</span></footer></main>
<div id="overlay" class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Задание</h2><div class="contents" id="modalContent"></div><button class="ok" id="modalOK">OK</button></div></div>
<script>
'use strict';
const definitions=[
{id:'information',text:'Вводные данные, необходимые для выполнения задачи: информация о существовании проблемы и о том, что ее нужно решить; какие условия решения и какой результат нужно получить. Например, вы приехали в магазин к 9, а он работает с 10 часов. Вы потеряли время и не сделали покупки, потому что не знали условий решения задачи — расписание работы магазина.'},
{id:'connections',text:'Этот ресурс дает возможность быстро получить информацию. У социально активного человека много знакомых в разных городах и сферах, а значит, выше шанс быстрее решить любой вопрос: получить от людей помощь или информацию, необходимую для решения проблемы.'},
{id:'energy',text:'Чем лучше сон и состояние здоровья, тем выше настроение и больше сил на жизнь. Недосып может помешать переговорам или вызвать бессилие, тогда будет трудно заставить себя приступить к задачам. Этот ресурс быстро заканчивается и медленно восстанавливается, поэтому лучше ложиться до полуночи и научиться расслабляться перед сном, чтобы повысить его качество.'},
{id:'money',text:'Капитал, который выделяется на решение задачи. Например, предприниматель хочет развивать новое направление в бизнесе. Если у него есть финансы на это, он может незамедлительно приступить к новому делу. Если нужной суммы нет, то сначала придется потратить время на привлечение капитала.'},
{id:'skills',text:'Умения, которые нужны для выполнения задачи. Например, без умения анализировать финансовый отчет не получится принять решение на его основе.'},
{id:'people',text:'Сотрудники, которых вовлекаем в решение задачи. Например, директору поступает задача, он делегирует ее подчиненным. Если сотрудники не могут выполнить задачу, директору приходится делать ее самостоятельно.'},
{id:'materials',text:'Предметы, которые нужны для выполнения задачи: телефон, ноутбук, ручка, машина и т. д. Например, чтобы договориться о встрече, нужен телефон, чтобы доехать до встречи — машина. Этот ресурс помогает быстрее достигать результата.'},
{id:'time',text:'Один километр можно пройти пешком за 12 минут, пробежать за 6 или проехать на машине за полторы минуты. Так и в работе: в зависимости от подхода меняется количество минут, которое уходит на выполнение задачи. Чем эффективнее подобран инструмент, тем быстрее будет выполнена задача.'}
];
const names=[{id:'materials',name:'Материальный ресурс'},{id:'connections',name:'Ресурс связи'},{id:'energy',name:'Энергия'},{id:'money',name:'Деньги'},{id:'time',name:'Время'},{id:'skills',name:'Знания и навыки'},{id:'people',name:'Люди'},{id:'information',name:'Информация'}];
let assignments={};let expanded=new Set();let checked=false;let selected=null;let drag=null;let nameOrder=[];let defOrder=[];
const $=id=>document.getElementById(id);const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function modal(title,content){$('modalTitle').textContent=title;$('modalContent').textContent=content;$('overlay').classList.remove('hidden')}
$('modalOK').onclick=()=>$('overlay').classList.add('hidden');$('help').onclick=()=>modal('Задание','Перед вами названия ресурсов и их определения. Соедините название каждого ресурса с его расшифровкой. Перетаскивайте названия на карточки с определениями. Длинный текст можно раскрыть кнопкой «Подробнее». Чтобы исправить пару, нажмите ↩ на размещённом названии либо перетащите его обратно в область названий, затем выберите другое определение. Остальные ответы сохраняются. Правильность определяется только после нажатия «Проверить».');
function locate(id){return Object.keys(assignments).find(key=>assignments[key]===id)}
function assign(id,def){if(!id||!def)return;for(const key of Object.keys(assignments)){if(assignments[key]===id)delete assignments[key]} assignments[def]=id;selected=null;checked=false;$('retry').hidden=true;render()}
function unassign(id){for(const key of Object.keys(assignments)){if(assignments[key]===id)delete assignments[key]}checked=false;selected=null;$('retry').hidden=true;render()}
function render(){let defs=$('defs'),labels=$('labels');const defsScroll=defs.scrollTop;const labelsScroll=$('namesScroll').scrollTop;defs.innerHTML='';labels.innerHTML='';for(let i=0;i<defOrder.length;i++){const d=defOrder[i];let card=document.createElement('div');card.className='definition'+(checked?(assignments[d.id]===d.id?' good':assignments[d.id]?' bad':''):'');card.dataset.def=d.id;const top=document.createElement('div');top.className='def-top';top.innerHTML='<span class="num">'+(i+1)+'</span>';const txt=document.createElement('div');txt.className='deftext'+(expanded.has(d.id)?'':' collapsed');txt.textContent=d.text;card.append(top,txt);const more=document.createElement('button');more.className='readmore';more.textContent=expanded.has(d.id)?'Свернуть':'Подробнее';more.onclick=()=>{expanded.has(d.id)?expanded.delete(d.id):expanded.add(d.id);render()};card.append(more);const slot=document.createElement('div');slot.className='slot'+(assignments[d.id]?' filled':'');slot.dataset.def=d.id;if(assignments[d.id]){slot.append(createName(names.find(n=>n.id===assignments[d.id]),true))}else{slot.textContent='Перетащите название сюда';slot.onclick=()=>{if(selected)assign(selected,d.id)}}card.append(slot);defs.append(card)}let free=nameOrder.filter(n=>!locate(n.id));for(const n of free){labels.append(createName(n))}if(!free.length){const done=document.createElement('div');done.className='empty';done.textContent='Все названия распределены';labels.append(done)}$('count').textContent=Object.keys(assignments).length+' из 8';defs.scrollTop=defsScroll;$('namesScroll').scrollTop=labelsScroll}
function createName(n,inSlot=false){let b=document.createElement('div');b.className='labelcard'+(selected===n.id?' selected':'');if(checked&&locate(n.id))b.className+=locate(n.id)===n.id?' good':' bad';b.textContent=n.name;b.dataset.name=n.id;if(inSlot){const returnButton=document.createElement('button');returnButton.className='returnBtn';returnButton.type='button';returnButton.textContent='↩';returnButton.title='Вернуть в общий список';returnButton.setAttribute('aria-label','Вернуть «'+n.name+'» в общий список');returnButton.addEventListener('pointerdown',e=>e.stopPropagation());returnButton.addEventListener('click',e=>{e.stopPropagation();unassign(n.id);$('notice').textContent='Карточка «'+n.name+'» возвращена в общий список. Остальные ответы сохранены.'});b.append(returnButton)}b.tabIndex=0;b.setAttribute('role','button');b.setAttribute('aria-label',n.name+', перетащите к определению');b.addEventListener('pointerdown',startDrag);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=n.id;render()}});b.onclick=()=>{if(window._justDragged)return;selected=selected===n.id?null:n.id;render()};return b}
function startDrag(e){if(e.button!==undefined&&e.button!==0)return;const src=e.currentTarget;const id=src.dataset.name;let ghost=document.createElement('div');ghost.className='dragghost';ghost.textContent=src.textContent;document.body.appendChild(ghost);drag={id,pid:e.pointerId,ghost,startX:e.clientX,startY:e.clientY,moved:false};ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';src.setPointerCapture?.(e.pointerId);e.preventDefault()}
window.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';if(Math.abs(e.clientX-drag.startX)+Math.abs(e.clientY-drag.startY)>8)drag.moved=true;document.querySelectorAll('.definition.over').forEach(n=>n.classList.remove('over'));const el=document.elementFromPoint(e.clientX,e.clientY);const target=el?.closest('.definition');if(target)target.classList.add('over');const returnArea=el?.closest('#returnZone, .labelsPane');$('returnZone').classList.toggle('over',!!returnArea);const sc=$('defs');const rect=sc.getBoundingClientRect();if(e.clientX>rect.left&&e.clientX<rect.right){if(e.clientY<rect.top+32)sc.scrollTop-=12;if(e.clientY>rect.bottom-32)sc.scrollTop+=12}}, {passive:true});
window.addEventListener('pointerup',e=>{if(!drag||drag.pid!==e.pointerId)return;const state=drag;drag=null;state.ghost.remove();document.querySelectorAll('.definition.over').forEach(n=>n.classList.remove('over'));$('returnZone').classList.remove('over');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.definition');if(state.moved){window._justDragged=true;setTimeout(()=>window._justDragged=false,90);if(target)assign(state.id,target.dataset.def);else if(document.elementFromPoint(e.clientX,e.clientY)?.closest('.labelsPane')){unassign(state.id);$('notice').textContent='Карточка возвращена в общий список. Остальные ответы сохранены.'}}else{selected=selected===state.id?null:state.id;render()}});
$('check').onclick=()=>{let total=Object.keys(assignments).length;if(total<8){$('notice').textContent='Сначала распределите все 8 названий. Осталось: '+(8-total)+'.';return}checked=true;selected=null;const correct=Object.entries(assignments).filter(([d,n])=>d===n).length;$('notice').textContent=correct===8?'Отлично! Все 8 пар составлены правильно.':'Верных пар: '+correct+' из 8. Нажмите ↩ на неверной карточке или перетащите её обратно в общий список.';$('retry').hidden=correct===8;render()};$('retry').onclick=()=>{checked=false;$('retry').hidden=true;$('notice').textContent='Можно нажать ↩ на карточке, перетащить её в общий список или сразу перенести к другому определению. Остальные ответы сохранятся.';render()};$('reset').onclick=()=>{assignments={};expanded=new Set();checked=false;selected=null;nameOrder=shuffle(names);defOrder=shuffle(definitions);$('retry').hidden=true;$('notice').textContent='Составьте пары. Карточки перемешаны.';$('defs').scrollTop=0;render()};
$('fullscreen').onclick=async()=>{const app=$('app');if(document.fullscreenElement){try{await document.exitFullscreen()}catch{}app.classList.remove('expanded')}else if(app.classList.contains('expanded'))app.classList.remove('expanded');else{try{await app.requestFullscreen()}catch{app.classList.add('expanded')}}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('app').classList.remove('expanded')});
$('reset').click();$('help').click();
</script></body></html>
