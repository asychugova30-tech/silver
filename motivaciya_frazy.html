<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Верные и неверные фразы для мотивации</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#353535}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f7f7}body{display:grid;place-items:center}button{font:inherit;cursor:pointer}.game{position:relative;width:min(100%,900px);height:min(92dvh,1050px);min-height:640px;overflow:hidden;isolation:isolate;background:#edf4d4;box-shadow:0 2px 15px #0002;touch-action:pan-y}.zones{position:absolute;inset:0;display:grid;grid-template-rows:50% 50%;pointer-events:none}.zone{position:relative;display:flex;justify-content:center;align-items:flex-end;padding-bottom:4%;background:radial-gradient(ellipse at 42% 40%,#cce1a0,#e2edc9 78%)}.zone.bad{background:radial-gradient(ellipse at 48% 45%,#ffd096,#ffe6c9 80%)}.zone-label{font-size:clamp(23px,4.3vw,43px);font-weight:400;color:#414141;opacity:.94;text-align:center}.toolbar{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:30}.tool{border:0;background:#fff9;color:#2f703b;border-radius:8px;display:grid;place-items:center;width:36px;height:36px;font-size:24px;box-shadow:0 2px 5px #0002}.card{position:absolute;z-index:4;width:clamp(172px,31%,258px);min-height:104px;border-radius:20px;background:white;box-shadow:0 5px 9px #0003;padding:20px 13px 16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(15px,2.35vw,23px);line-height:1.36;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;border:5px solid transparent;transform:translate(-50%,-50%);transition:border-color .15s,box-shadow .15s}.card:active{cursor:grabbing}.card::before{content:"";position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);width:25px;height:25px;border-radius:50%;background:#ed3820;box-shadow:0 2px 5px #0003}.card.good-zone::before{background:#00a54b}.card.checked-ok{border-color:#86ed87}.card.checked-wrong{border-color:#ef7777}.card.dragging{z-index:15;box-shadow:0 13px 28px #0004;transition:none}.check{position:absolute;bottom:18px;right:20px;z-index:25;border:0;border-radius:50%;width:66px;height:66px;color:white;background:#278cda;box-shadow:0 3px 7px #0004;font-size:30px;display:grid;place-items:center}.check svg{width:33px;height:33px}.result{position:absolute;bottom:94px;right:14px;left:14px;z-index:26;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;background:#ffffffee;padding:12px;border-radius:16px;box-shadow:0 4px 15px #0002;text-align:center;font-size:16px}.result.visible{display:flex}.result button{padding:9px 13px;border-radius:24px;border:0;background:#e9e9e9}.result button.primary{background:#2389d4;color:white}.overlay{position:absolute;inset:0;z-index:50;background:#0004;display:flex;align-items:center;justify-content:center;padding:16px}.overlay[hidden]{display:none}.dialog{width:min(480px,100%);max-height:80%;overflow:auto;background:#fff;border:13px solid #dedede;border-radius:17px;box-shadow:0 0 20px #0007;padding:17px 16px 13px;text-align:center}.dialog h1{font-size:30px;margin:5px 0 15px}.dialog p{text-align:left;font-size:clamp(17px,3vw,24px);line-height:1.45;margin:0 0 16px}.dialog button{border:0;border-radius:40px;background:#e7e7e7;padding:7px 35px;font-size:24px}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:560px){.game{height:min(86dvh,850px);min-height:600px}.card{width:41%;border-radius:16px;padding:14px 7px 9px;font-size:clamp(12px,3.1vw,17px);min-height:90px;border-width:4px}.card::before{width:19px;height:19px}.zone-label{font-size:clamp(23px,6vw,34px)}.check{width:56px;height:56px}.result{font-size:13px}}@media(max-height:700px){.game{height:100dvh;min-height:550px}}:fullscreen .game{width:100vw;height:100dvh;max-height:none;max-width:none}:fullscreen .card{font-size:clamp(17px,2.3vw,30px);width:clamp(190px,27%,330px)}:fullscreen .zone-label{font-size:clamp(29px,4vw,55px)}
</style>
</head>
<body>
<main class="game" id="game" aria-label="Распределение фраз по категориям">
 <div class="zones"><section class="zone"><div class="zone-label">Верные фразы</div></section><section class="zone bad"><div class="zone-label">Неверные фразы</div></section></div>
 <div class="toolbar"><button class="tool" id="help" aria-label="Инструкция" title="Инструкция">❔</button><button class="tool" id="full" aria-label="Полный экран" title="Полный экран">⛶</button></div>
 <div id="cards"></div>
 <div class="result" id="result"><span id="message"></span><button id="retry" class="primary">Попробовать снова</button><button id="reset">Начать заново</button></div>
 <button class="check" id="check" aria-label="Проверить ответы" title="Проверить ответы"><svg viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M25 17v8H6V6h13"/><path d="m12 15 5 5L29 7"/></svg></button>
 <div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><h1 id="dialogtitle">Задание</h1><p>Перетащите три верных фразы для мотивации равнодушных в левый столбец, а три неверных — в правый.</p><button id="ok">OK</button></div></div>
</main>
<script>
(()=>{'use strict';
const game=document.getElementById('game'),layer=document.getElementById('cards'),overlay=document.getElementById('overlay'),res=document.getElementById('result'),msg=document.getElementById('message');
const data=[
 {text:'«В течение месяца мы сделаем А и Б, а после этого сделаем В»',correct:'good',x:21,y:17},
 {text:'«Если наладим вот здесь, то твоя премия вырастет на 10 процентов»',correct:'good',x:74,y:17},
 {text:'«Мы уже внесли изменения на участке Х, и теперь сотрудник там работает вдвое быстрее»',correct:'good',x:60,y:37},
 {text:'«Если наладим вот здесь, ты почувствуешь качественный скачок в работе, который подстегнет твои показатели к небесам»',correct:'bad',x:18,y:61},
 {text:'«Мы уже внесли изменения на участке Х, и в течение года рассчитываем увидеть улучшения»',correct:'bad',x:74,y:62},
 {text:'«Не будем подробно рассказывать, что изменится – просто поверь, что станет лучше»',correct:'bad',x:53,y:88}
];
let checked=false,drag=null;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function zone(y){return y<50?'good':'bad'}
function make(){layer.innerHTML='';data.forEach((d,i)=>{let el=document.createElement('div');el.className='card';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',d.text+'. Перетащите в нужную зону');el.textContent=d.text;el.dataset.i=i;layer.append(el);d.el=el;place(d);el.addEventListener('pointerdown',down);el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();d.x=clamp(d.x+(e.key==='ArrowLeft'?-3:e.key==='ArrowRight'?3:0),5,95);d.y=clamp(d.y+(e.key==='ArrowUp'?-4:e.key==='ArrowDown'?4:0),5,95);place(d);clearMarks()}})});}
function place(d){d.el.style.left=d.x+'%';d.el.style.top=d.y+'%';d.el.classList.toggle('good-zone',zone(d.y)==='good')}
function clearMarks(){checked=false;res.classList.remove('visible');data.forEach(d=>d.el.classList.remove('checked-ok','checked-wrong'))}
function down(e){if(e.button!==undefined&&e.button!==0)return;if(!overlay.hidden)return;const d=data[+e.currentTarget.dataset.i];const r=game.getBoundingClientRect();drag={d,id:e.pointerId,dx:e.clientX-(r.left+r.width*d.x/100),dy:e.clientY-(r.top+r.height*d.y/100)};d.el.classList.add('dragging');d.el.setPointerCapture(e.pointerId);d.el.addEventListener('pointermove',move);d.el.addEventListener('pointerup',up);d.el.addEventListener('pointercancel',up);e.preventDefault()}
function move(e){if(!drag||e.pointerId!==drag.id)return;const r=game.getBoundingClientRect();const {d,dx,dy}=drag;const halfX=d.el.offsetWidth/2,halfY=d.el.offsetHeight/2;d.x=100*clamp(e.clientX-dx-r.left,halfX+5,r.width-halfX-5)/r.width;d.y=100*clamp(e.clientY-dy-r.top,halfY+5,r.height-halfY-5)/r.height;place(d)}
function up(e){if(!drag||e.pointerId!==drag.id)return;const el=drag.d.el;el.classList.remove('dragging');el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);drag=null;clearMarks()}
function validate(){let n=0;data.forEach(d=>{let ok=zone(d.y)===d.correct;d.el.classList.toggle('checked-ok',ok);d.el.classList.toggle('checked-wrong',!ok);if(ok)n++});checked=true;msg.textContent=n===6?'Отлично! Все шесть фраз распределены верно.':`Верно: ${n} из 6. Исправьте карточки с красной рамкой.`;res.classList.add('visible')}
function reset(){data.forEach((d,i)=>{const pos=[[31,24],[70,57],[57,40],[19,66],[80,28],[53,76]][i];d.x=pos[0];d.y=pos[1];place(d)});clearMarks()}
document.getElementById('ok').onclick=()=>{overlay.hidden=true};document.getElementById('help').onclick=()=>overlay.hidden=false;document.getElementById('check').onclick=validate;document.getElementById('retry').onclick=clearMarks;document.getElementById('reset').onclick=reset;document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else game.requestFullscreen?.().catch(()=>{})};
make();reset();overlay.hidden=false;
})();
</script>
</body>
</html>
