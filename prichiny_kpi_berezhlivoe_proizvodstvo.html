<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Почему не нужны отдельные KPI</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#333;--green:#cfe5a4;--orange:#ffdab2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f7f7}button{font:inherit;cursor:pointer}.app{position:relative;height:min(90vh,850px);min-height:540px;width:100%;max-width:1250px;margin:auto;overflow:hidden;user-select:none;touch-action:pan-y;background:#fff}.app:fullscreen{height:100vh;max-width:none;min-height:0}.zones{position:absolute;inset:0;display:flex;flex-direction:column}.zone{flex:1;position:relative}.zone.true{background:radial-gradient(ellipse at 60% 38%,#d9e9b6 0%,var(--green) 76%,#bfdc90 100%)}.zone.false{background:radial-gradient(ellipse at 55% 40%,#ffe7d1 0%,var(--orange) 80%,#ffc78d 100%)}.zone-title{position:absolute;left:0;right:0;text-align:center;font-size:clamp(24px,3.3vw,46px);font-weight:400;pointer-events:none;z-index:0}.true .zone-title{top:38%}.false .zone-title{top:39%}.toolbar{position:absolute;z-index:30;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.small{width:36px;height:36px;background:#ffffffdf;border:1px solid #ddd;border-radius:8px;box-shadow:0 1px 4px #0002;pointer-events:auto;font-weight:700;font-size:21px;color:#29844c}.small.full{color:#d74a4a}.card{position:absolute;z-index:8;width:clamp(170px,27%,310px);min-height:108px;display:flex;align-items:center;justify-content:center;background:white;border-radius:20px;box-shadow:0 6px 10px #0004;padding:22px 13px 14px;text-align:center;font-size:clamp(17px,2.25vw,26px);line-height:1.25;touch-action:none;cursor:grab;overflow-wrap:break-word;transition:border-color .15s,box-shadow .15s,border-width .15s}.card.dragging{cursor:grabbing;z-index:19;box-shadow:0 12px 22px #0005}.card .pin{position:absolute;top:-1px;left:50%;transform:translate(-50%,-40%);height:28px;width:28px;border-radius:50%;background:linear-gradient(125deg,#ff7244,#f21d00);box-shadow:0 3px 6px #0003}.card[data-zone="true"] .pin{background:linear-gradient(130deg,#26d486,#008e41)}.card.correct{border:9px solid #8cf18b;padding:13px 4px 5px}.card.incorrect{border:9px solid #ee6f70;padding:13px 4px 5px}.card .pin{pointer-events:none}.check{position:absolute;right:22px;bottom:22px;width:66px;height:66px;border-radius:50%;border:0;background:#3199dd;box-shadow:0 3px 7px #0005;color:white;font-size:32px;font-weight:bold;z-index:22}.check:hover{background:#2586c7}.overlay{position:absolute;inset:0;background:#0005;z-index:50;display:flex;justify-content:center;align-items:center;padding:12px}.modal{background:#fff;border:13px solid #d9d9d9;border-radius:17px;max-width:540px;width:min(100%,540px);box-shadow:0 0 16px #0008;padding:20px 22px;max-height:88%;overflow-y:auto;text-align:left}.modal h2{text-align:center;font-size:clamp(24px,4vw,32px);margin:0 0 16px}.modal p{font-size:clamp(18px,2.7vw,24px);line-height:1.38;margin:10px 0 18px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.action{border:0;border-radius:50px;background:#e8e8ea;color:#333;padding:9px 26px;font-size:22px}.action.primary{background:#3299db;color:#fff}.feedback{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:24;border-radius:13px;background:#fffffff2;box-shadow:0 4px 16px #0004;padding:12px 18px;max-width:calc(100% - 120px);text-align:center;font-size:16px}.feedback button{border:0;background:#3299db;color:white;padding:9px 14px;border-radius:10px;margin:6px 4px 0}.hidden{display:none!important}@media(max-width:520px){.app{height:calc(100dvh - 20px);min-height:540px}.card{width:43%;font-size:clamp(14px,3.5vw,19px);min-height:104px;border-radius:16px;padding:16px 8px 12px}.card.correct,.card.incorrect{border-width:6px;padding:10px 2px 6px}.card .pin{width:22px;height:22px}.zone-title{font-size:clamp(24px,6vw,33px)}.check{height:58px;width:58px;right:16px;bottom:16px}.feedback{max-width:calc(100% - 28px);bottom:82px;font-size:14px}}
</style></head><body><main class="app" id="app" aria-label="Интерактивное задание"><div class="zones"><section class="zone true"><div class="zone-title">Истинные причины</div></section><section class="zone false"><div class="zone-title">Ложные причины</div></section></div><div class="toolbar"><button class="small" id="help" aria-label="Инструкция" title="Инструкция">?</button><button class="small full" id="fullscreen" aria-label="Полный экран" title="Полный экран">⛶</button></div><button class="check" id="check" aria-label="Проверить ответы" title="Проверить ответы">☑</button><div class="feedback hidden" id="feedback" role="status"></div><div class="overlay" id="overlay"><div class="modal"><h2>Задание</h2><p>Как думаете, почему не нужны отдельные KPI для методов бережливого производства? Перетащите две истинных причины в столбец слева, а две ложных причины в столбец справа.</p><div class="actions"><button class="action" id="ok">OK</button></div></div></div></main><script>
(()=>{'use strict';const app=document.getElementById('app'),overlay=document.getElementById('overlay'),feedback=document.getElementById('feedback');const items=[{id:'a',text:'Так мы отделяем бережливое производство от основной работы',correct:'true',zone:'false',x:.42,y:.60},{id:'b',text:'Так мы дублируем измерения уже существующих показателей',correct:'true',zone:'true',x:.58,y:.19},{id:'c',text:'Так мы смещаем мотивацию сотрудников в материальную плоскость',correct:'false',zone:'false',x:.10,y:.70},{id:'d',text:'Так мы делаем работу с бережливым производством слишком простой',correct:'false',zone:'true',x:.07,y:.45}];const els=new Map();let drag=null,checked=false;
function scale(){const r=app.getBoundingClientRect();return {w:r.width,h:r.height}}function bound(it){const el=els.get(it.id),s=scale();const w=el.offsetWidth,h=el.offsetHeight;it.x=Math.max(0,Math.min(1-w/s.w,it.x));it.y=Math.max(0,Math.min(1-h/s.h,it.y));el.style.left=it.x*s.w+'px';el.style.top=it.y*s.h+'px';it.zone=it.y+(h/s.h)/2<.5?'true':'false';el.dataset.zone=it.zone}
function clearCheck(){if(!checked)return;checked=false;items.forEach(i=>els.get(i.id).classList.remove('correct','incorrect'));feedback.classList.add('hidden');feedback.innerHTML=''}
function begin(ev,it){if(overlay&&!overlay.classList.contains('hidden'))return;if(ev.button!==undefined&&ev.button!==0)return;clearCheck();const el=els.get(it.id),r=app.getBoundingClientRect();drag={it,el,pid:ev.pointerId,dx:ev.clientX-r.left-it.x*r.width,dy:ev.clientY-r.top-it.y*r.height};el.classList.add('dragging');el.setPointerCapture(ev.pointerId);ev.preventDefault()}
function move(ev){if(!drag||drag.pid!==ev.pointerId)return;const r=app.getBoundingClientRect();drag.it.x=(ev.clientX-r.left-drag.dx)/r.width;drag.it.y=(ev.clientY-r.top-drag.dy)/r.height;bound(drag.it);ev.preventDefault()}
function end(ev){if(!drag||drag.pid!==ev.pointerId)return;const {el}=drag;el.classList.remove('dragging');drag=null}
function init(){items.forEach(it=>{const el=document.createElement('div');el.className='card';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',it.text+'. Стрелки перемещают карточку, пробел переносит в другую зону');el.innerHTML='<span class="pin"></span><span></span>';el.lastElementChild.textContent=it.text;els.set(it.id,el);app.insertBefore(el,document.getElementById('check'));el.addEventListener('pointerdown',ev=>begin(ev,it));el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('keydown',ev=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(ev.key)){ev.preventDefault();clearCheck();if(ev.key===' '){it.y=it.zone==='true'?.70:.18}else {const step=ev.shiftKey?.06:.018;it.x+=(ev.key==='ArrowRight'?step:ev.key==='ArrowLeft'?-step:0);it.y+=(ev.key==='ArrowDown'?step:ev.key==='ArrowUp'?-step:0)}bound(it)}})});requestAnimationFrame(()=>items.forEach(bound))}
function check(){const all=items.every(i=>i.zone===i.correct);checked=true;items.forEach(i=>els.get(i.id).classList.add(i.zone===i.correct?'correct':'incorrect'));feedback.innerHTML=all?'<strong>Верно! Все причины распределены правильно.</strong><div><button data-act="restart">Начать заново</button></div>':'<strong>Есть ошибки в распределении.</strong> Красным отмечены неверные ответы.<div><button data-act="retry">Попробовать снова</button><button data-act="restart">Начать заново</button></div>';feedback.classList.remove('hidden')}
function reset(){clearCheck();const initial=[['false',.42,.60],['true',.58,.19],['false',.10,.70],['true',.07,.45]];items.forEach((i,n)=>{i.zone=initial[n][0];i.x=initial[n][1];i.y=initial[n][2];bound(i)})}feedback.addEventListener('click',ev=>{const action=ev.target.dataset.act;if(action==='retry')clearCheck();if(action==='restart')reset()});document.getElementById('check').addEventListener('click',check);document.getElementById('ok').addEventListener('click',()=>overlay.classList.add('hidden'));document.getElementById('help').addEventListener('click',()=>overlay.classList.remove('hidden'));document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await app.requestFullscreen()}catch(e){alert('Полноэкранный режим недоступен в этом браузере.')}});window.addEventListener('resize',()=>items.forEach(bound));document.addEventListener('fullscreenchange',()=>setTimeout(()=>items.forEach(bound),80));init();})();
</script></body></html>
