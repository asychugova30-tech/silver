<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Кому делегировать важную задачу</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#333;background:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;}body{overflow-x:hidden}.activity{position:relative;isolation:isolate;max-width:900px;width:100%;height:min(540px,96dvh);min-height:340px;margin:0 auto;background:#fff;overflow:hidden}.activity:fullscreen{max-width:none;width:100vw;height:100dvh;min-height:0}.activity:-webkit-full-screen{max-width:none;width:100vw;height:100vh}.top{position:absolute;inset:10px 13px auto;display:flex;align-items:center;justify-content:space-between;z-index:8}.icon-btn{border:0;background:transparent;color:#2793cd;cursor:pointer;padding:8px;border-radius:8px;display:grid;place-items:center}.icon-btn:hover,.icon-btn:focus-visible{background:#eaf6fc}.icon-btn svg{width:24px;height:24px}.content{width:min(800px,100%);height:100%;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:66px 35px 95px}.sentence{font-size:clamp(19px,2.6vw,26px);line-height:1.65;text-align:left;max-width:730px;width:100%}.blank-wrap{position:relative;display:inline-block;vertical-align:middle;margin:0 3px}.blank{min-width:80px;max-width:min(87vw,330px);min-height:43px;background:#fff;border:2px solid #c9c9c9;border-radius:6px;padding:5px 17px;color:#333;cursor:pointer;font:inherit;font-size:inherit;line-height:1.3;text-align:center}.blank.empty{width:84px;background:#fff}.blank.filled{background:#f7f7f7}.blank.correct{background:#91ec8a;border-color:#4bbf55}.blank.wrong{background:#ffcad0;border-color:#e65b65}.blank:focus-visible{outline:3px solid #63b1e1;outline-offset:2px}.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:10;width:max-content;min-width:245px;max-width:min(330px,85vw);background:white;border:1px solid #d5d5d5;border-radius:6px;box-shadow:0 8px 22px #0002;padding:7px 0}.menu[hidden]{display:none}.choice{display:block;width:100%;border:0;background:#fff;color:#333;text-align:left;font-size:18px;padding:13px 21px;cursor:pointer}.choice:hover,.choice:focus-visible{background:#edf5ff}.check{position:absolute;right:22px;bottom:20px;width:62px;height:62px;display:grid;place-items:center;border:0;border-radius:50%;background:#2e91d9;color:#fff;cursor:pointer;box-shadow:0 3px 6px #0003}.check svg{width:31px;height:31px}.check:focus-visible{outline:3px solid #184d80;outline-offset:3px}.feedback{max-width:730px;width:100%;margin-top:25px;font-size:17px;line-height:1.4;display:none}.feedback.visible{display:block}.feedback.ok{color:#267e3f}.feedback.error{color:#ae3642}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.secondary{padding:9px 16px;border-radius:20px;background:#f0f0f0;color:#333;border:1px solid #ddd;cursor:pointer;font-size:15px}.overlay{position:absolute;inset:0;background:#0004;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.overlay[hidden]{display:none}.modal{width:min(470px,95%);max-height:86%;overflow:auto;background:white;border:12px solid #dedede;outline:2px solid #bdbdbd;border-radius:12px;box-shadow:0 10px 25px #0005;text-align:center;padding:17px 19px 20px}.modal h1{font-size:25px;margin:0 0 12px}.modal p{font-size:21px;line-height:1.45;text-align:left;margin:0 0 16px}.modal button{padding:6px 31px;border:0;border-radius:30px;background:#e8e8ea;color:#333;font-size:22px;cursor:pointer}@media(max-width:560px){.activity{height:min(510px,90dvh);min-height:330px}.content{padding:62px 25px 98px}.sentence{font-size:20px}.choice{font-size:17px}.feedback{font-size:16px}.check{height:58px;width:58px}.modal p{font-size:18px}}@media(max-height:420px){.content{padding-top:42px;padding-bottom:67px}.sentence{font-size:18px}.check{width:51px;height:51px;right:12px;bottom:9px}.feedback{margin-top:10px}}
</style></head><body><main class="activity" id="activity"><header class="top"><button class="icon-btn" id="help" aria-label="Показать инструкцию" title="Инструкция"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.4 9a2.7 2.7 0 0 1 5.2 1c0 1.7-2.6 2.1-2.6 4"/><circle cx="12" cy="18" r=".7" fill="currentColor"/></svg></button><button class="icon-btn" id="fullscreen" aria-label="На весь экран" title="На весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button></header><section class="content"><div class="sentence">Передавать важную задачу, когда вы и так опасаетесь, что лучше вас никто не справится, стоит только <span class="blank-wrap"><button id="blank" class="blank empty" aria-haspopup="listbox" aria-expanded="false" aria-label="Выберите вариант ответа">&nbsp;</button><div id="menu" class="menu" role="listbox" hidden><button class="choice" role="option" data-value="пионеру">пионеру</button><button class="choice" role="option" data-value="профессионалу">профессионалу</button><button class="choice" role="option" data-value="раздолбаю">раздолбаю</button><button class="choice" role="option" data-value="хорошисту">хорошисту</button></div></span>.</div><div id="feedback" class="feedback" aria-live="polite"></div></section><button class="check" id="check" aria-label="Проверить ответ" title="Проверить ответ"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="22" height="22" rx="4"/><path d="m10 16 5 5 10-12"/></svg></button><div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h1 id="modal-title">Задание</h1><p id="modal-text">Нажмите на пустое поле и выберите верный вариант ответа.</p><button id="modal-ok">OK</button></div></div></main><script>
(()=>{'use strict';const el=id=>document.getElementById(id), activity=el('activity'),blank=el('blank'),menu=el('menu'),feedback=el('feedback'),overlay=el('overlay');let selected='',checked=false;const showModal=(text,title='Задание')=>{el('modal-title').textContent=title;el('modal-text').textContent=text;overlay.hidden=false;el('modal-ok').focus()};const hideModal=()=>{overlay.hidden=true;blank.focus({preventScroll:true})};el('modal-ok').addEventListener('click',hideModal);el('help').addEventListener('click',()=>showModal('Нажмите на пустое поле и выберите верный вариант ответа.'));function closeMenu(){menu.hidden=true;blank.setAttribute('aria-expanded','false')}blank.addEventListener('click',e=>{e.stopPropagation();if(!overlay.hidden)return;menu.hidden=!menu.hidden;blank.setAttribute('aria-expanded',String(!menu.hidden))});menu.addEventListener('click',e=>{const btn=e.target.closest('[data-value]');if(!btn)return;selected=btn.dataset.value;blank.textContent=selected;blank.className='blank filled';checked=false;feedback.className='feedback';feedback.innerHTML='';closeMenu();blank.focus({preventScroll:true})});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.blank-wrap'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!overlay.hidden)hideModal()}});el('check').addEventListener('click',()=>{closeMenu();if(!selected){showModal('Сначала выберите вариант ответа, затем нажмите «Проверить».','Не выбран ответ');return}checked=true;const ok=selected==='профессионалу';blank.className='blank filled '+(ok?'correct':'wrong');feedback.className='feedback visible '+(ok?'ok':'error');feedback.innerHTML=ok?'<strong>Отлично, верное решение!</strong><div class="actions"><button class="secondary" id="reset">Начать заново</button></div>':'<strong>Не совсем так.</strong> Для важной задачи, требующей самостоятельности и надёжного результата, нужен сотрудник с высокой квалификацией и высокой мотивацией. Вы можете изменить ответ, не начиная всё сначала.<div class="actions"><button class="secondary" id="retry">Попробовать снова</button><button class="secondary" id="reset">Начать заново</button></div>';el('retry')?.addEventListener('click',()=>{blank.className='blank filled';feedback.className='feedback';feedback.innerHTML='';menu.hidden=false;blank.setAttribute('aria-expanded','true')});el('reset').addEventListener('click',()=>{selected='';checked=false;blank.innerHTML='&nbsp;';blank.className='blank empty';feedback.className='feedback';feedback.innerHTML='';closeMenu()})});el('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(activity.requestFullscreen){await activity.requestFullscreen()}else if(activity.webkitRequestFullscreen){activity.webkitRequestFullscreen()}}catch(e){showModal('Полноэкранный режим недоступен в этом браузере или внутри платформы.','Полноэкранный режим')}});})();
</script></body></html>
