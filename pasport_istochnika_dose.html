<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Практика — Досье на источник</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#29333c;background:#fff;--blue:#238bd6;--line:#dce6ec;--light:#f5f9fa;--green:#268b58;--red:#bd4c54}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.app{position:relative;width:min(100%,820px);height:min(680px,calc(100dvh - 16px));min-height:420px;margin:8px auto;background:#fffdf4;border:1px solid #e9e7d8;border-radius:17px;box-shadow:0 4px 20px #27384612;display:flex;flex-direction:column;overflow:hidden}.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}.top .group{display:flex;gap:8px;align-items:center}.circle{width:34px;height:34px;border-radius:50%;border:1px solid #d9e4e9;background:#fff;color:#456272;font-weight:700;display:grid;place-items:center}.circle:hover{background:#eaf5fb}.heading{font-size:15px;font-weight:750}.subtitle{font-size:12px;color:#66747c}.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:15px 19px 18px}.stephead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.tag{font-size:11px;color:#4a6474;background:#e8f2f6;padding:5px 9px;border-radius:20px;white-space:nowrap}h1{font-size:20px;margin:0 0 9px;line-height:1.3}h2{font-size:16px;margin:0 0 8px}.lead{line-height:1.55;font-size:14px;margin:0 0 14px}.panel{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;margin-bottom:11px}.note{background:#eff6f8;border-left:3px solid #7fabc2;padding:11px 13px;border-radius:8px;line-height:1.55;font-size:14px}.documents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.doc{border:1px solid #d7e2e7;border-radius:11px;background:#fff;padding:12px;min-height:100px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:5px}.doc:hover,.doc:focus-visible{border-color:var(--blue);background:#f4fbff}.doc .glyph{font-size:22px}.doc strong{font-size:13px}.doc small{font-size:11px;color:#647b87}.doc .seen{font-size:11px;color:var(--green);margin-top:auto}.bottom{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:0;background:var(--blue);color:white;border-radius:9px;padding:11px 17px;font-size:13px;font-weight:700}.btn:hover:enabled{background:#1775b9}.secondary{background:#eaf3f7;color:#2a6685}.secondary:hover:enabled{background:#d9edf5}.outline{background:#fff;color:#356277;border:1px solid #cbdce4}.progress{font-size:12px;color:#64737c}.small{font-size:12px;color:#64727a;line-height:1.5}.docview{white-space:pre-line;line-height:1.65;font-size:14px}.docview strong{color:#253f50}.passport{display:grid;gap:9px}.field{border:1px solid #dce5e9;background:#fff;border-radius:11px;padding:11px;display:grid;grid-template-columns: minmax(165px,0.9fr) minmax(0,1.4fr);gap:11px;align-items:center}.field .question{font-weight:700;font-size:13px}.field .hint{font-size:11px;color:#6c7a83;margin-top:4px}.field select{width:100%;min-height:42px;border:1px solid #cddbe1;border-radius:8px;background:#f8fafc;color:#273c47;padding:9px;font-size:13px;line-height:1.4}.field.good{border-color:#64b98a;background:#f2faf5}.field.bad{border-color:#db7a80;background:#fff4f4}.field.bad select{border-color:#c65b63}.field .state{grid-column:2;font-size:12px;font-weight:650}.field.bad .state{color:#ac3842}.field.good .state{color:#268b58}.feedback{border-radius:10px;background:#eff7fb;padding:11px 13px;margin-top:11px;line-height:1.5;font-size:13px}.feedback.error{background:#fff1f1;color:#823a3a}.feedback.success{background:#eaf7ee;color:#245c3e}.choices{display:grid;gap:9px}.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;background:white;border:1px solid #d9e4e9;border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.48}.choice:hover{border-color:#75aed0}.choice.active{border-color:#298dd0;background:#eef7ff}.choice.wrong{border-color:#cf626b;background:#fff0f1}.choice.correct{border-color:#5aab7f;background:#effaf3}.dot{flex:none;width:20px;height:20px;border:2px solid #aec4d0;border-radius:100%;margin-top:1px}.choice.active .dot{border:6px solid #328ec6}.choice.wrong .dot{border:6px solid #c55762}.choice.correct .dot{border:6px solid #368e5f}.summary{display:grid;gap:7px}.summary .line{background:#f5f8fa;padding:9px 11px;border-radius:7px;font-size:13px;line-height:1.45}.summary b{display:block;font-size:11px;color:#607682;margin-bottom:3px}.modalwrap{position:absolute;inset:0;background:#1a2d40a8;z-index:10;display:grid;place-items:center;padding:14px}.modal{background:#fff;border-radius:16px;box-shadow:0 14px 40px #0003;width:min(100%,540px);max-height:calc(100% - 10px);display:flex;flex-direction:column;overflow:hidden}.modal h2{padding:17px 18px 7px;margin:0}.modal .modalbody{padding:0 18px 16px;overflow:auto;line-height:1.65;font-size:14px;white-space:pre-line}.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}.hidden{display:none!important}.app:fullscreen{width:100%;height:100dvh;max-width:none;min-height:0;border-radius:0;margin:0}.app:fullscreen .content{max-width:1050px;width:100%;margin:auto}.app:fullscreen .heading{font-size:18px}.app:fullscreen .lead,.app:fullscreen .docview{font-size:clamp(15px,1.35vw,18px)}.app:fullscreen .field select,.app:fullscreen .choice{font-size:clamp(14px,1.1vw,17px)}@media(max-width:570px){.app{height:calc(100dvh - 8px);margin:4px auto;border-radius:10px;min-height:360px}.content{padding:12px 13px}.heading{font-size:13px}.documents{gap:7px}.doc{padding:10px;min-height:112px}.doc strong{font-size:12px}.field{grid-template-columns:1fr;gap:7px}.field .state{grid-column:1}.field select{font-size:13px}.top{padding:9px 11px}.bottom{padding:9px 11px}.btn{padding:10px 12px}}@media(max-height:490px){.top{padding:5px 12px}.bottom{padding:5px 12px}.content{padding-top:8px}.circle{width:29px;height:29px}.btn{padding:8px 13px}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="top"><div class="group"><button class="circle" id="help" title="Инструкция" aria-label="Открыть инструкцию">?</button><div><div class="heading">Практика · Досье на источник</div><div class="subtitle">Проверка сведений перед решением</div></div></div><button class="circle" id="full" title="На весь экран" aria-label="На весь экран">⛶</button></header>
<section class="content" id="content"></section>
<footer class="bottom"><span class="progress" id="progress">Этап 1 из 3</span><div class="group"><button class="btn outline" id="restart">Начать заново</button><button class="btn" id="primary">Продолжить</button></div></footer>
<div class="modalwrap" id="modal" role="dialog" aria-modal="true" aria-labelledby="modtitle"><div class="modal"><h2 id="modtitle">Задание</h2><div class="modalbody" id="modaltext"></div><footer><button class="btn" id="closemodal">OK</button></footer></div></div>
</main>
<script>
(()=>{'use strict';
const docs=[
 {title:'Сообщение начальника смены',kind:'Рабочий чат',glyph:'💬',body:'Мне передали, что упаковочных материалов осталось совсем мало. Сотрудник склада сказал, что следующая поставка под вопросом. Возможно, придётся остановить линию.'},
 {title:'Комментарий сотрудника склада',kind:'Сообщение',glyph:'📋',body:'Вчера мы пересчитали остатки. На складе 4800 упаковок. Обычно расходуем примерно 1200 упаковок в день. По графику новая партия должна поступить в среду, но подтверждения от поставщика я ещё не видел.'},
 {title:'Данные учётной системы',kind:'Отчёт',glyph:'📊',body:'Остаток на начало понедельника: 4800 упаковок.\nПлановый расход: понедельник — 1200; вторник — 1200; среда — 1200; четверг — 1200.\nСледующая поставка: 6000 упаковок.\nПлановая дата поступления: среда.'},
 {title:'Письмо поставщика',kind:'Электронная почта',glyph:'✉️',body:'Добрый день! Подтверждаем отгрузку партии из 6000 упаковок во вторник. Ожидаемая доставка — в среду до 16:00. Если сроки изменятся, мы вам сообщим.'}
];
const fields=[
 {q:'Кто сообщил информацию?',hint:'От кого руководитель получил сообщение об остановке линии?',opts:['Начальник смены','Сотрудник склада','Представитель поставщика'],key:0,explanation:'О возможной остановке линии руководителю сообщил начальник смены. Он передал сведения, которые получил от другого сотрудника.'},
 {q:'Откуда он получил сведения?',hint:'Как начальник смены узнал о ситуации?',opts:['Из учётной системы','Из письма поставщика','Со слов сотрудника склада'],key:2,explanation:'Начальник смены пересказал сообщение сотрудника склада. Сам он не проверял остатки и сроки поставки.'},
 {q:'На какие данные нужно опираться?',hint:'Что поможет оценить риск остановки?',opts:['На сообщение о нехватке и сведения о прошлых поставках','На остатки, плановый расход и срок доставки','На мнение начальника смены о возможной остановке'],key:1,explanation:'Для оценки риска нужно сопоставить количество материалов на складе, плановый расход и подтверждённую дату поставки.'},
 {q:'Что подтверждает первоисточник?',hint:'Что известно после изучения документов?',opts:['Поставщик сообщил, что отгрузка задерживается','Запасов гарантированно хватит до конца следующей недели','Поставка подтверждена на среду, её поступление нужно проконтролировать'],key:2,explanation:'Письмо поставщика подтверждает запланированную доставку в среду. При текущем расходе запасов хватит до конца четверга, даже если поставка не придёт. Но получение партии ещё нужно проверить.'}
];
const decisions=[
 'Согласовать остановку линии на один день, чтобы исключить риск нехватки упаковки.',
 'Сохранить производственный план, проконтролировать доставку и подготовить действия на случай задержки.',
 'Оставить план без изменений и больше не проверять поставку, поскольку поставщик подтвердил дату.'
];
let step=0, seen=new Set(), selected=[null,null,null,null], states=[null,null,null,null], passportChecked=false, decision=null, decisionChecked=false, done=false;
const $=id=>document.getElementById(id), content=$('content');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scrollTop(){content.scrollTop=0}
function modal(title,html){$('modtitle').textContent=title;$('modaltext').textContent=html;$('modal').classList.remove('hidden');}
$('closemodal').addEventListener('click',()=>$('modal').classList.add('hidden'));
$('help').addEventListener('click',()=>modal('Задание','Руководитель получил сообщение о возможной остановке упаковочной линии. Проверьте, на чём основаны эти сведения. Сначала изучите рабочие материалы, затем заполните паспорт источника и выберите решение.'));
$('restart').addEventListener('click',()=>{step=0;seen=new Set();selected=[null,null,null,null];states=[null,null,null,null];passportChecked=false;decision=null;decisionChecked=false;done=false;render();scrollTop()});
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('app').requestFullscreen)await $('app').requestFullscreen();}catch(e){modal('Полноэкранный режим','Не удалось включить полноэкранный режим в этом браузере. Задание можно пройти в обычном режиме.')}});
document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'⤢':'⛶');
function docModal(i){seen.add(i);modal(docs[i].title,docs[i].body);render()}
function setStep(x){step=x;render();scrollTop()}
function render(){
 $('progress').textContent=done?'Задание завершено':`Этап ${step+1} из 3`;
 $('restart').textContent=done?'Начать заново':'Начать заново';
 if(step===0){content.innerHTML=`<div class="stephead"><span class="tag">1 · Изучите материалы</span><span class="small">Открыто ${seen.size} из 4</span></div><h1>Что известно об упаковке?</h1><p class="lead">Руководитель производственного подразделения получил сообщение о возможной остановке упаковочной линии. Из-за нехватки материалов могут пострадать сроки выполнения заказов. Прежде чем менять производственный план, нужно проверить информацию.</p><div class="note" style="margin-bottom:12px"><b>Начальник смены:</b> «На складе почти не осталось упаковочных материалов. Говорят, новая поставка задерживается. Похоже, со следующей недели придётся останавливать линию».</div><h2>Рабочие материалы</h2><p class="small" style="margin-top:0">Откройте документы и выясните, на чём основано сообщение.</p><div class="documents">${docs.map((d,i)=>`<button class="doc" data-doc="${i}"><span class="glyph">${d.glyph}</span><strong>${escape(d.title)}</strong><small>${escape(d.kind)}</small>${seen.has(i)?'<span class="seen">✓ Изучено</span>':'<span class="seen" style="color:#387eaf">Открыть</span>'}</button>`).join('')}</div>`;content.querySelectorAll('[data-doc]').forEach(b=>b.addEventListener('click',()=>docModal(Number(b.dataset.doc))));$('primary').textContent='Заполнить паспорт →';$('primary').disabled=seen.size!==4;
 }else if(step===1){content.innerHTML=`<div class="stephead"><span class="tag">2 · Проверьте источник</span><button class="btn secondary" id="viewdocs" style="padding:7px 10px">Материалы ↗</button></div><h1>Паспорт источника</h1><p class="lead">Вы изучили рабочие материалы. Заполните паспорт источника, чтобы определить, что подтверждено и на какие сведения можно опираться при принятии решения.</p><div class="passport">${fields.map((f,i)=>`<div class="field ${states[i]==='good'?'good':states[i]==='bad'?'bad':''}"><div><div class="question">${i+1}. ${escape(f.q)}</div><div class="hint">${escape(f.hint)}</div></div><select aria-label="${escape(f.q)}" data-field="${i}"><option value="">Выберите вариант</option>${f.opts.map((v,j)=>`<option value="${j}" ${selected[i]===j?'selected':''}>${escape(v)}</option>`).join('')}</select>${states[i]?`<div class="state">${states[i]==='good'?'✓ Подтверждено':'Проверьте ещё раз'}</div>`:''}</div>`).join('')}</div>${passportChecked&&states.every(x=>x==='good')?`<div class="feedback success">Вы установили, откуда появились сведения, и проверили их по документам. Теперь можно оценить риск остановки линии.</div>`:''}`;
 content.querySelectorAll('[data-field]').forEach(sel=>sel.addEventListener('change',()=>{let i=Number(sel.dataset.field);selected[i]=sel.value===''?null:Number(sel.value);states[i]=null;passportChecked=false;const parent=sel.closest('.field');parent.classList.remove('good','bad');parent.querySelector('.state')?.remove();updatePrimary()}));$('viewdocs').addEventListener('click',()=>modal('Рабочие материалы',docs.map((d,i)=>`${i+1}. ${d.title}\n${d.body}`).join('\n\n────────────────\n\n')));updatePrimary();
 }else{content.innerHTML=`<div class="stephead"><span class="tag">3 · Примите решение</span><button class="btn secondary" id="viewdocs" style="padding:7px 10px">Материалы ↗</button></div><h1>Что делать руководителю?</h1><p class="lead">Руководителю нужно утвердить производственный план на предстоящую неделю. Начальник смены предлагает заранее остановить упаковочную линию на один день, чтобы не начинать работу, для которой может не хватить материалов.</p><div class="panel"><h2 style="margin-bottom:8px">Проверенные сведения</h2><div class="summary">${[['Кто сообщил','Начальник смены'],['Как узнал','Со слов сотрудника склада'],['Что проверили','Остатки, плановый расход и письмо поставщика'],['Что установили','На начало понедельника — 4800 упаковок; расход — 1200 в день. Поставка 6000 упаковок подтверждена на среду до 16:00']].map(([a,b])=>`<div class="line"><b>${a}</b>${b}</div>`).join('')}</div></div><h2>Как лучше поступить?</h2><div class="choices">${decisions.map((t,i)=>`<button data-choice="${i}" class="choice ${decision===i?'active':''} ${decisionChecked&&decision===i?(i===1?'correct':'wrong'):''}"><span class="dot"></span><span>${escape(t)}</span></button>`).join('')}</div>${decisionChecked?`<div class="feedback ${decision===1?'success':'error'}">${decision===1?'Проверка показала, что текущих запасов достаточно, а поставщик подтвердил доставку в среду. Поэтому заранее останавливать линию не нужно. Однако поставка ещё не поступила. Руководителю стоит сохранить план, проконтролировать доставку и подготовить действия на случай задержки.':'Выбранное действие пока не учитывает всю проверенную информацию. Сравните остатки материалов, плановый расход и подтверждённый срок поставки. При этом помните, что подтверждённая поставка ещё не означает, что материалы уже поступили.'}</div>`:''}`;
 content.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{decision=Number(b.dataset.choice);decisionChecked=false;render();}));$('viewdocs').addEventListener('click',()=>modal('Рабочие материалы',docs.map((d,i)=>`${i+1}. ${d.title}\n${d.body}`).join('\n\n────────────────\n\n')));updatePrimary();}
}
function updatePrimary(){if(step===1){let all=selected.every(x=>x!==null);let good=states.every(x=>x==='good');$('primary').textContent=good?'К решению →':'Проверить';$('primary').disabled=!good&&!all;}else if(step===2){$('primary').textContent=decisionChecked&&decision===1?'Завершить':'Проверить';$('primary').disabled=decision===null;} }
$('primary').addEventListener('click',()=>{
 if(step===0){if(seen.size===4)setStep(1);return}
 if(step===1){if(states.every(x=>x==='good')){setStep(2);return} passportChecked=true;states=selected.map((x,i)=>x===fields[i].key?'good':'bad');render();if(states.some(x=>x==='bad')){const el=document.createElement('div');el.className='feedback error';el.textContent='Некоторые сведения в паспорте не подтверждаются документами. Вернитесь к материалам и проверьте отмеченные поля.';content.appendChild(el)}return}
 if(step===2){if(decisionChecked&&decision===1){done=true;content.innerHTML=`<div class="stephead"><span class="tag">Задание завершено</span></div><div style="text-align:center;padding:22px 6px"><div style="font-size:48px;margin-bottom:8px">✓</div><h1>Паспорт источника составлен</h1><p class="lead">Вы проверили информацию об остановке производства и выяснили, что тревожный вывод возник из пересказа неполных сведений. Паспорт источника помог найти исходные данные, сопоставить их и принять решение с учётом возможной задержки поставки.</p></div>`;$('progress').textContent='Задание завершено';$('primary').textContent='Пройти ещё раз';$('primary').disabled=false;step=3;scrollTop();return} decisionChecked=true;render();return}
 if(step===3){seen=new Set();selected=[null,null,null,null];states=[null,null,null,null];passportChecked=false;decision=null;decisionChecked=false;done=false;setStep(0)}
});
render();modal('Задание','Руководитель получил сообщение о возможной остановке упаковочной линии. Проверьте сведения перед принятием решения.\n\n1. Изучите четыре рабочих документа.\n2. Заполните паспорт источника.\n3. На основе проверенной информации выберите действие руководителя.');
})();
</script>
</body></html>
